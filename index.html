<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hinugyaw Lions Club – Club Manager</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
:root{--bg:#f4f5f9;--card:#fff;--tx:#14213d;--mu:#667085;--pr:#0b2a6b;--prt:#fff;--ac:#f2b90c;--bd:#dde1ea;--ok:#177245;--bad:#b3261e;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1424;--card:#171f36;--tx:#e8ecf6;--mu:#98a2bd;--pr:#1d3f95;--bd:#2a3556;--ok:#5fd394;--bad:#ff8a80}}
:root[data-theme="dark"]{--bg:#0e1424;--card:#171f36;--tx:#e8ecf6;--mu:#98a2bd;--pr:#1d3f95;--bd:#2a3556;--ok:#5fd394;--bad:#ff8a80}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{background:var(--pr);color:var(--prt);padding:14px 16px 0;border-bottom:4px solid var(--ac)}
header h1{margin:0;font-size:20px}header small{opacity:.85}
nav{display:flex;gap:2px;overflow-x:auto;margin-top:10px}
nav button{background:none;border:0;color:#cfd8f5;padding:10px 14px;font:600 14px inherit;cursor:pointer;border-radius:8px 8px 0 0;white-space:nowrap}
nav button.on{background:var(--bg);color:var(--tx)}
main{max-width:1000px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:14px}
.card h3{margin:0 0 10px;font-size:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.stat{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px}
.stat span{display:block;color:var(--mu);font-size:12px}.stat b{font-size:20px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:end}
label{display:flex;flex-direction:column;font-size:12px;color:var(--mu);gap:3px;flex:1 1 140px}
input,select,textarea{font:inherit;padding:8px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);min-width:0}
textarea{min-height:70px}
button.b{background:var(--pr);color:#fff;border:0;border-radius:8px;padding:8px 14px;font:600 14px inherit;cursor:pointer}
button.g{background:var(--ac);color:#14213d}button.s{padding:4px 9px;font-size:12px}button.x{background:none;color:var(--bad);border:1px solid var(--bd)}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--bd);white-space:nowrap}th{color:var(--mu);font-size:12px}
td.n,th.n{text-align:right}.bad{color:var(--bad)}.ok{color:var(--ok)}
.tag{font-size:11px;padding:2px 8px;border-radius:99px;border:1px solid var(--bd)}
.mu{color:var(--mu)}details{border-top:1px solid var(--bd);padding:8px 0}summary{cursor:pointer;font-weight:600}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#14213d;color:#fff;padding:8px 16px;border-radius:99px;display:none;z-index:99}
#doc{position:fixed;inset:0;background:rgba(0,0,0,.6);overflow:auto;padding:16px;z-index:50}
.sheet{background:#fff;color:#111;max-width:680px;margin:0 auto;padding:28px;border-radius:6px}
.sheet h2{margin:0;color:#0b2a6b}.sheet table{color:#111}.sheet th,.sheet td{border-color:#ccc}
.big{font-size:28px;font-weight:700}.sig{margin-top:40px;display:flex;justify-content:space-between}.sig div{border-top:1px solid #111;padding-top:4px;width:40%;font-size:12px;text-align:center}
button,input,select,textarea{font-family:inherit}button{font-size:14px}nav button,button.b{font-weight:600}
body{font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:16px;-webkit-font-smoothing:antialiased}
h1,h2,h3,nav button,.stat b,.big,th{font-family:Montserrat,Inter,system-ui,sans-serif}
h1{letter-spacing:.2px}.card h3{font-size:17px}td.n,.stat b,.big{font-variant-numeric:tabular-nums}
.card,.stat{box-shadow:0 1px 3px rgba(11,42,107,.08)}th{text-transform:uppercase;letter-spacing:.4px;font-size:11px}
.sheet{font-family:Inter,system-ui,sans-serif}.sheet h2{letter-spacing:.3px}
nav select{background:var(--bg);color:var(--tx);border-radius:8px;padding:4px}.r-sec .money,.r-view .money{display:none}#main .card{max-width:none}.r-view .edit,.r-view button.b,.r-view button.x{display:none}
@media print{body>*:not(#doc){display:none!important}#doc{position:static;background:#fff;padding:0}.noprint{display:none!important}.sheet{padding:0}}
</style></head><body>
<header><h1 style="display:flex;align-items:center;gap:10px"><img id="hl" alt="Lions Club logo" style="height:46px"> <span>Hinugyaw Lions Club <small>· We Serve</small></span></h1><div id="who" style="font-size:12px;opacity:.85"></div><nav id="nav"></nav></header>
<main id="main"></main><div id="toast"></div><div id="doc" hidden></div>
<script>
const $=s=>document.querySelector(s),v=id=>{const e=document.getElementById(id);return e?e.value:''};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const php=n=>'₱'+Number(n||0).toLocaleString('en-PH',{minimumFractionDigits:2,maximumFractionDigits:2});
const today=()=>new Date().toISOString().slice(0,10),uid=()=>Math.random().toString(36).slice(2,9),pad=n=>String(n).padStart(4,'0');
const fd=d=>d?new Date(d+'T00:00').toLocaleDateString('en-PH',{year:'numeric',month:'short',day:'numeric'}):'—';
const FEES={old:[['Local Club Dues',3600],['District Dues',300],['International Dues',3000]],new:[['Local Club Dues',3600],['District Dues',300],['International Dues (one-time)',5000]]};
let S={members:[],charges:[],payments:[],invoices:[],accounts:[],exp:[],plans:[],payInfo:'',tasks:[],closing:'2026-08-14',lastBackup:'',seq:{inv:0,rec:0},
activities:[],
minutes:[{id:'m1',date:'2026-07-31',title:'Regular Meeting',att:'',notes:'Upcoming: Aug 15 Training & Orientation (₱500); Sep 12 Induction & Oathtaking (contribution TBA). Closing of past-due accounts: Aug 14, 2026.',dec:'Old members: ₱6,900/yr (Local 3,600 + District 300 + International 3,000). New members: ₱8,900 (International 5,000 one-time).'}]};
const TABS={dash:'Dashboard',mem:'Members',bill:'Billing',pay:'Payments',exp:'Expenses',rep:'Reports',act:'Activities',min:'Minutes',acc:'Accounts'};
const ROLES={admin:'President / Admin',treas:'Treasurer',sec:'Secretary',view:'Member (view only)'};
const ALLOW={view:['dash','act'],admin:Object.keys(TABS),treas:['dash','mem','bill','pay','exp','rep'],sec:['dash','mem','act','min']};
let session=null;try{session=JSON.parse(sessionStorage.getItem('hlc_session')||'null')}catch(e){}
let role=session?session.role:null,accSeeded=false;
let tab='dash',doc=null,editAcc=null,pend='',ref=null,lastJ='',saveT,tt,resetConfirm=false;
async function hash(s){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
async function ensureAdmin(){if(accSeeded||S.accounts.length)return;accSeeded=true;S.accounts.push({id:uid(),name:'Administrator',username:'admin',pass:await hash('admin123'),role:'admin',def:true});save()}
async function doLogin(){if(loading)return toast('Still loading your club\'s data – please wait a moment');const u=v('lu').trim().toLowerCase(),p=v('lp'),r=v('lr');if(!u||!p)return toast('Enter username and password');
 const acc=S.accounts.find(a=>a.username.toLowerCase()==u);if(!acc)return toast('No such account');
 if(acc.role!==r)return toast('That account is not registered as '+ROLES[r]);
 if(acc.pass!==await hash(p))return toast('Wrong password');
 session={accId:acc.id,name:acc.name,role:acc.role};try{sessionStorage.setItem('hlc_session',JSON.stringify(session))}catch(e){}
 role=session.role;tab='dash';render()}
function doLogout(){session=null;role=null;try{sessionStorage.removeItem('hlc_session')}catch(e){}render()}
const mem=id=>S.members.find(m=>m.id==id)||{name:'(removed)',type:'old'};
const opts=()=>S.members.map(m=>`<option value="${m.id}">${esc(m.name)}</option>`).join('');
const toast=t=>{const e=$('#toast');e.textContent=t;e.style.display='block';clearTimeout(tt);tt=setTimeout(()=>e.style.display='none',2200)};
function calc(id){const cs=S.charges.filter(c=>c.mid==id).sort((a,b)=>a.date.localeCompare(b.date));
 const tp=S.payments.filter(p=>p.mid==id&&!p.void).reduce((s,p)=>s+p.amt,0);let pool=tp,billed=0;
 const rows=cs.map(c=>{const a=Math.min(pool,c.amt);pool-=a;billed+=c.amt;return{...c,paid:a,bal:c.amt-a}});
 return{rows,billed,paid:tp,bal:billed-tp}}
const stat=r=>r.bal<=0?'<span class="tag ok">Paid</span>':r.due&&r.due<today()?'<span class="tag bad">Past due</span>':r.paid>0?'<span class="tag">Partial</span>':'<span class="tag">Unpaid</span>';
function save(){render();clearTimeout(saveT);saveT=setTimeout(()=>{lastJ=JSON.stringify(S);
 if(ref)ref.set({json:lastJ}).catch(()=>toast('Could not save – check access'));else try{localStorage.setItem('hlc',lastJ)}catch(e){}},300)}
function load(j){try{const o=JSON.parse(j);if(j!==lastJ){S=Object.assign(S,o);lastJ=j;render()}}catch(e){}}

function render(){
 if(!session){$('#nav').innerHTML='';$('#who').textContent='';$('#main').className='';$('#main').innerHTML=loginHTML();const d=$('#doc');d.hidden=true;return}
 role=session.role;
 if(!ALLOW[role].includes(tab))tab='dash';
 $('#nav').innerHTML=ALLOW[role].map(k=>`<button class="${k==tab?'on':''}" onclick="tab='${k}';render()">${TABS[k]}</button>`).join('')+`<button class="noprint" style="margin-left:auto;align-self:center" onclick="doLogout()">Sign out</button>`;
 $('#main').className='r-'+role;$('#main').innerHTML=V[tab]();$('#who').textContent='Signed in as '+esc(session.name)+' · '+ROLES[role];
 const d=$('#doc');d.hidden=!doc;d.innerHTML=doc?docHTML():''}
function loginHTML(){if(loading)return`<div class="card" style="max-width:360px;margin:40px auto"><h3>Sign in</h3><p class="mu">Loading your club's saved accounts…</p></div>`;
 const acc=S.accounts.find(a=>a.role=='admin'&&a.def);
 return`<div class="card" style="max-width:360px;margin:40px auto"><h3>Sign in</h3><div class="row"><label>Role<select id="lr">${Object.entries(ROLES).map(([k,t])=>`<option value="${k}">${t}</option>`).join('')}</select></label></div><div class="row"><label>Username<input id="lu" autocomplete="username"></label></div><div class="row"><label>Password<input id="lp" type="password" autocomplete="current-password"></label></div><p><button class="b" onclick="doLogin()">Sign in</button></p>${acc?'<p class="mu" style="font-size:12px">Default admin login: <b>admin</b> / <b>admin123</b> — please change this once signed in.</p>':''}
 <p style="font-size:12px"><a href="javascript:void(0)" onclick="resetConfirm=!resetConfirm;render()">Forgot the password, or can't sign in?</a></p>
 ${resetConfirm?`<div style="border-top:1px solid var(--bd);margin-top:8px;padding-top:8px"><p class="mu" style="font-size:12px">${dbReady?"This clears only this device's saved copy and re-downloads the shared club data fresh — nobody else's access or data changes.":"This copy is running as a standalone file with no shared server, so this permanently erases every record saved in THIS browser only — members, billing, minutes, everything — and starts over with the default admin account (admin / admin123). This cannot be undone."}</p><label>Type RESET to confirm<input id="rc"></label><button class="b x" onclick="doReset()">Reset this device</button></div>`:''}</div>`}
function doReset(){if((v('rc')||'').trim().toUpperCase()!=='RESET')return toast('Type RESET in capital letters to confirm');
 try{for(const k in PARTS)localStorage.removeItem('hlc_'+k)}catch(e){}
 location.reload()}
const V={
dash(){const all=S.members.map(m=>({m,...calc(m.id)}));const sum=k=>all.reduce((s,x)=>s+x[k],0);
 const pd=all.flatMap(x=>x.rows).filter(r=>r.bal>0&&r.due&&r.due<today()).reduce((s,r)=>s+r.bal,0);
 const top=all.filter(x=>x.bal>0).sort((a,b)=>b.bal-a.bal).slice(0,6);
 const acts=[...S.activities].sort((a,b)=>b.date.localeCompare(a.date)).slice(0,5);
 return`<div class="grid money"><div class="stat"><span>Members</span><b>${S.members.length}</b></div><div class="stat"><span>Total billed</span><b>${php(sum('billed'))}</b></div><div class="stat"><span>Collected</span><b class="ok">${php(sum('paid'))}</b></div><div class="stat"><span>Outstanding</span><b class="bad">${php(all.reduce((s,x)=>s+Math.max(0,x.bal),0))}</b></div><div class="stat"><span>Past due</span><b class="bad">${php(pd)}</b></div></div>
 ${dashX()}${milestones()}${lyCard()}<div class="card money"><h3>Highest balances</h3>${top.length?`<div class="tw"><table>${top.map(x=>`<tr><td>${esc(x.m.name)}</td><td><span class="tag">${x.m.type=='new'?'New':'Old'}</span></td><td class="n bad">${php(x.bal)}</td></tr>`).join('')}</table></div>`:'<p class="mu">No outstanding balances yet. Add members, then bill their dues.</p>'}</div>
 <div class="card"><h3>Recent &amp; upcoming activities</h3>${acts.map(a=>`<div>${fd(a.date)} — <b>${esc(a.title)}</b> <span class="mu">${a.amt?php(a.amt):'TBA'}</span> ${a.date<today()?'<span class="tag">Done</span>':'<span class="tag ok">Upcoming</span>'}</div>`).join('')||'<p class="mu">No activities yet.</p>'}</div>
 <div class="card"><h3>Ideas to organize the club</h3><ul class="mu" style="margin:0;padding-left:18px"><li>Bill dues at the start of each Lions year and set past-due closing dates.</li><li>Use “Past due” billing to enter old balances so nothing is lost.</li><li>Record every payment the same day so receipts stay in order.</li><li>Send each member their invoice/statement before every meeting.</li><li>Keep minutes with action items and who is responsible.</li><li>Export the member balance list monthly as a backup.</li></ul><p class="money"><button class="b g" onclick="exportCSV()">Export balances (CSV)</button></p></div>`},
mem(){if(role=='sec')return memSec();return`<div class="card"><h3>Add member</h3><div class="row"><label>Full name<input id="mn"></label><label>Type<select id="mt"><option value="old">Old member</option><option value="new">New member</option></select></label><label>Contact<input id="mc"></label><label>Date joined<input id="mj" type="date"></label><label>Birthday<input id="mb" type="date"></label><button class="b" onclick="addMember()">Add</button></div></div>
 <div class="card"><h3>Members &amp; balances</h3><div class="tw"><table><tr><th>Name</th><th>Type</th><th>Status</th><th>Attend.</th><th class="n">Billed</th><th class="n">Paid</th><th class="n">Balance</th><th></th></tr>${S.members.map(m=>{const c=calc(m.id);return`<tr><td>${esc(m.name)}<div class="mu" style="font-size:12px">${esc(m.contact)}</div></td><td>${m.type=='new'?'New':'Old'}</td><td><select onchange="setSt('${m.id}',this.value)">${['active','inactive','resigned','transferred'].map(x=>`<option${(m.status||'active')==x?' selected':''}>${x}</option>`).join('')}</select></td><td>${att(m.id)}</td><td class="n">${php(c.billed)}</td><td class="n">${php(c.paid)}</td><td class="n ${c.bal>0?'bad':'ok'}">${php(c.bal)}</td><td><button class="b s" onclick="billDues('${m.id}')">Bill dues</button> <button class="b s g" onclick="makeInv('${m.id}')">Invoice</button> <button class="b s" onclick="doc={k:'stm',mid:'${m.id}'};render()">Statement</button> ${c.bal>0?`<button class="b s" onclick="remind('${m.id}')">Remind</button>`:''} <button class="b s x" onclick="del('members','${m.id}')">Delete</button></td></tr>`}).join('')||'<tr><td class="mu">No members yet.</td></tr>'}</table></div><p class="mu" style="font-size:12px">Standard dues — Old: ₱6,900/yr · New: ₱8,900 (incl. ₱5,000 one-time international).</p></div>`},
bill(){const y=new Date().getFullYear();return`<div class="card"><h3>Payment details shown on invoices</h3><textarea id="pi" style="width:100%" placeholder="GCash 09xx… / Bank account… / Treasurer name">${esc(S.payInfo)}</textarea><p><button class="b s" onclick="S.payInfo=v('pi');save()">Save</button></p></div><div class="card"><h3>Add charge / past due</h3><div class="row"><label>Member<select id="bm"><option value="all">All members</option>${opts()}</select></label><label>Category<select id="bc"><option>Dues</option><option>Past due</option><option>Activity</option><option>Other</option></select></label><label>Description<input id="bd"></label><label>Amount<input id="ba" type="number" min="0"></label><label>Billed on<input id="bt" type="date" value="${today()}"></label><label>Due date<input id="bu" type="date"></label><button class="b" onclick="addCharge()">Add</button></div></div>
 <div class="card"><h3>Bill annual dues to all members</h3><div class="row"><label>Year<input id="fy" type="number" value="${y}"></label><label>Due date<input id="fdue" type="date" value="${y}-12-31"></label><button class="b g" onclick="billAll()">Bill everyone</button></div></div>
 <div class="card"><h3>Charges</h3><div class="tw"><table><tr><th>Date</th><th>Member</th><th>Description</th><th>Due</th><th class="n">Amount</th><th class="n">Balance</th><th>Status</th><th></th></tr>${S.members.flatMap(m=>calc(m.id).rows).sort((a,b)=>b.date.localeCompare(a.date)).map(r=>`<tr><td>${fd(r.date)}</td><td>${esc(mem(r.mid).name)}</td><td>${esc(r.desc)}</td><td>${fd(r.due)}</td><td class="n">${php(r.amt)}</td><td class="n">${php(r.bal)}</td><td>${stat(r)}</td><td><button class="b s x" onclick="del('charges','${r.id}')">✕</button></td></tr>`).join('')}</table></div></div>
 ${plansCard()}<div class="card"><h3>Invoices issued</h3>${S.invoices.slice().reverse().map(i=>`<div>${i.no} · ${esc(mem(i.mid).name)} · ${php(i.total)} · ${fd(i.date)} <button class="b s" onclick="doc={k:'inv',id:'${i.id}'};render()">View</button> ${i.void?'<span class="tag bad">VOID</span>':`<button class="b s x" onclick="voidInv('${i.id}')">Void</button>`}</div>`).join('')||'<p class="mu">None yet. Use the Invoice button on the Members tab.</p>'}</div>`},
pay(){return`<div class="card"><h3>Record payment / collection</h3><div class="row"><label>Member<select id="pm" onchange="showBal()">${opts()}</select></label><label>Amount<input id="pa" type="number" min="0"></label><label>Date<input id="pt" type="date" value="${today()}"></label><label>Method<select id="pw"><option>Cash</option><option>GCash</option><option>Bank transfer</option><option>Check</option></select></label><label>Reference no.<input id="pr"></label><label>Note<input id="pn"></label><button class="b" onclick="addPay()">Save &amp; receipt</button></div><p class="mu" id="pbal"></p></div>
 <div class="card"><h3>Payments</h3><div class="tw"><table><tr><th>OR no.</th><th>Date</th><th>Member</th><th>Method</th><th class="n">Amount</th><th></th></tr>${S.payments.slice().reverse().map(p=>`<tr><td>${p.no}</td><td>${fd(p.date)}</td><td>${esc(mem(p.mid).name)}</td><td>${esc(p.method)}</td><td class="n">${php(p.amt)}</td><td><button class="b s" onclick="doc={k:'rec',id:'${p.id}'};render()">Receipt</button> ${p.void?'<span class="tag bad">VOID</span>':`<button class="b s x" onclick="voidPay('${p.id}')">Void</button>`}</td></tr>`).join('')}</table></div><p><b>Total collected: ${php(S.payments.filter(p=>!p.void).reduce((s,p)=>s+p.amt,0))}</b></p></div>`},
act(){return`<div class="card edit"><h3>Add activity</h3><div class="row"><label>Title<input id="at"></label><label>Date<input id="ad" type="date"></label><label>Contribution (₱)<input id="aa" type="number" min="0"></label><label>Notes<input id="an"></label><button class="b" onclick="addAct()">Add</button></div></div>
 <div class="card"><h3>Activities</h3>${[...S.activities].sort((a,b)=>b.date.localeCompare(a.date)).map(a=>`<div style="padding:8px 0;border-top:1px solid var(--bd)"><b>${esc(a.title)}</b> · ${fd(a.date)} · ${a.amt?php(a.amt):'Contribution TBA'}<div class="mu">${esc(a.notes)}</div>${a.amt?`<button class="b s g" onclick="billAct('${a.id}')">Bill contribution to all</button> `:''}<button class="b s x" onclick="del('activities','${a.id}')">Delete</button></div>`).join('')}</div>`},
min(){return`<div class="card"><h3>New minutes of meeting</h3><div class="row"><label>Date<input id="nd" type="date" value="${today()}"></label><label>Title<input id="nt" value="Regular Meeting"></label></div><div id="pres" style="margin:8px 0"><b>Present:</b> <button class="b s" onclick="document.querySelectorAll('#pres input').forEach(i=>i.checked=true)">Tick all</button> ${S.members.map(m=>`<label style="flex:none;flex-direction:row;align-items:center;display:inline-flex;margin-right:10px"><input type="checkbox" value="${m.id}"> ${esc(m.name)}</label>`).join('')}</div><div class="row"><label>Guests / others<textarea id="na"></textarea></label><label>Discussion<textarea id="nn"></textarea></label><label>Decisions / action items<textarea id="nc"></textarea></label></div><p><button class="b" onclick="addMin()">Save minutes</button></p></div>

async function addAcc(){const n=v('an2').trim(),u=v('au2').trim(),p=v('ap2');if(!n||!u||!p)return toast('Fill in all fields');

const PARTS={core:['members','accounts'],fin:['charges','payments','invoices','exp','plans','seq','payInfo','closing','lastBackup'],sec:['activities','minutes','tasks']};
let last={},refs={},dbReady=false;const pj=k=>JSON.stringify(PARTS[k].reduce((o,f)=>(o[f]=S[f],o),{}));
function save(){render();clearTimeout(saveT);saveT=setTimeout(()=>{for(const k in PARTS){const j=pj(k);if(j===last[k])continue;last[k]=j;if(refs[k])refs[k].set({json:j}).catch(()=>toast('Could not save – check access'));else try{localStorage.setItem('hlc_'+k,j)}catch(e){}}},300)}
function loadPart(k,j){if(j===last[k])return;try{Object.assign(S,JSON.parse(j));last[k]=j;render()}catch(e){}}
let loading=true;
const FIREBASE_CONFIG={apiKey:"",authDomain:"",projectId:"",storageBucket:"",messagingSenderId:"",appId:""}; // ⚠️ paste your Firebase project's config here for self-hosted live sync
async function getBackend(){
 try{const cdb=await window.claude?.use('db');if(cdb)return id=>cdb.doc('club/'+id)}catch(e){}
 if(window.firebase&&FIREBASE_CONFIG.apiKey){try{
   if(!firebase.apps.length)firebase.initializeApp(FIREBASE_CONFIG);
   const fs=firebase.firestore();
   return id=>{const r=fs.collection('club').doc(id);return{
     get:()=>r.get().then(s=>({exists:s.exists,data:()=>s.data()})),
     set:d=>r.set(d),
     onSnapshot:cb=>r.onSnapshot(s=>cb({exists:s.exists,data:()=>s.data(),metadata:{hasPendingWrites:s.metadata.hasPendingWrites}}))}}
 }catch(e){}}
 return null}
async function init(){render();for(const k in PARTS){try{const j=localStorage.getItem('hlc_'+k);if(j)loadPart(k,j)}catch(e){}}
 try{const mk=await getBackend();if(!mk){loading=false;if(!S.accounts.length)await ensureAdmin();else render();return}
 for(const k in PARTS){const dref=mk(k);const d=await dref.get();if(d.exists)loadPart(k,d.data().json);else last[k]=pj(k);refs[k]=dref;dref.onSnapshot(x=>{if(x.exists&&!x.metadata.hasPendingWrites)loadPart(k,x.data().json)})}
 dbReady=true;loading=false;if(!S.accounts.length)await ensureAdmin();else render()}catch(e){loading=false;render()}}
function setSt(id,x){mem(id).status=x;save()}
function voidPay(id){if(pend!=='v'+id){pend='v'+id;return toast('Tap Void again to confirm')}pend='';S.payments.find(x=>x.id==id).void=true;save()}
function voidInv(id){if(pend!=='v'+id){pend='v'+id;return toast('Tap Void again to confirm')}pend='';S.invoices.find(x=>x.id==id).void=true;save()}
function milestones(){const mo=today().slice(5,7),y=+today().slice(0,4),L=[];S.members.forEach(m=>{if((m.status||'active')!='active')return;if(m.bday&&m.bday.slice(5,7)==mo)L.push('🎂 '+esc(m.name)+' — '+m.bday.slice(8)+'/'+mo);if(m.joined&&m.joined.slice(5,7)==mo&&+m.joined.slice(0,4)<y)L.push('🦁 '+esc(m.name)+' — '+(y-m.joined.slice(0,4))+' yr member')});return`<div class="card"><h3>This month's birthdays &amp; anniversaries</h3>${L.map(x=>`<div>${x}</div>`).join('')||'<p class="mu">None this month.</p>'}</div>`}
const lyNow=()=>{const d=new Date();return d.getMonth()>=6?d.getFullYear():d.getFullYear()-1};let lyy=lyNow();
const inLY=(d,y)=>d>=y+'-07-01'&&d<=(y+1)+'-06-30';
function lySum(y){const as=S.activities.filter(a=>inLY(a.date,y)),f=(L,g)=>L.reduce((s,x)=>s+g(x),0);return{b:f(S.charges.filter(c=>inLY(c.date,y)),c=>c.amt),c:f(S.payments.filter(p=>!p.void&&inLY(p.date,y)),p=>p.amt),e:f(S.exp.filter(x=>inLY(x.date,y)),x=>x.amt),n:as.length,ben:f(as,a=>+a.ben||0),raised:f(as,a=>+a.raised||0)}}
function lyCard(){const r=lySum(lyy),n=lyNow();return`<div class="card money"><h3>Lions Year ${lyy}–${lyy+1}</h3><div class="row"><label>Lions year (Jul–Jun)<select onchange="lyy=+this.value;render()">${[n+1,n,n-1,n-2].map(y=>`<option value="${y}"${y==lyy?' selected':''}>${y}–${y+1}</option>`).join('')}</select></label><button class="b s g" onclick="doc={k:'ly',y:lyy};render()">Year-end report</button></div><p>Billed ${php(r.b)} · Collected <b class="ok">${php(r.c)}</b> · Expenses ${php(r.e)} · Net <b>${php(r.c-r.e)}</b><br>${r.n} activities · ${r.ben} beneficiaries</p></div>`}
function lyHTML(hd,bar){const y=doc.y,r=lySum(y),as=S.activities.filter(a=>inLY(a.date,y)),R=(a,b)=>`<tr><td>${a}</td><td class="n">${b}</td></tr>`;return`<div class="sheet">${bar}${hd('LIONS YEAR REPORT')}<p><b>${y}–${y+1}</b></p><table>${R('Billed',php(r.b))+R('Collected',php(r.c))+R('Expenses',php(r.e))+R('<b>Net funds</b>','<b>'+php(r.c-r.e)+'</b>')+R('Service projects',r.n)+R('Beneficiaries',r.ben)+R('Funds raised for projects',php(r.raised))}</table><h3>Activities</h3>${as.map(a=>`<div>${fd(a.date)} — ${esc(a.title)} (${a.ben||0} beneficiaries)</div>`).join('')}<div class="sig"><div>Treasurer</div><div>President</div></div></div>`}
function stmHTML(hd,bar){const m=mem(doc.mid),L=[...S.charges.filter(c=>c.mid==doc.mid).map(c=>({d:c.date,t:c.desc,dr:c.amt,cr:0})),...S.payments.filter(x=>x.mid==doc.mid&&!x.void).map(x=>({d:x.date,t:'Payment '+x.no+' ('+x.method+')',dr:0,cr:x.amt}))].sort((a,b)=>a.d.localeCompare(b.d));let b=0;
 return`<div class="sheet">${bar}${hd('STATEMENT OF ACCOUNT')}<p><b>${esc(m.name)}</b> · as of ${fd(today())}</p><table><tr><th>Date</th><th>Details</th><th class="n">Charge</th><th class="n">Paid</th><th class="n">Balance</th></tr>${L.map(x=>{b+=x.dr-x.cr;return`<tr><td>${fd(x.d)}</td><td>${esc(x.t)}</td><td class="n">${x.dr?php(x.dr):''}</td><td class="n">${x.cr?php(x.cr):''}</td><td class="n">${php(b)}</td></tr>`}).join('')}</table><p><b>Balance due: ${php(b)}</b></p></div>`}
function svcHTML(hd,bar){const a=S.activities.find(x=>x.id==doc.id),ex=S.exp.filter(e=>e.act==a.id).reduce((s,e)=>s+e.amt,0),R=(x,y)=>`<tr><td>${x}</td><td class="n">${y}</td></tr>`;
 return`<div class="sheet">${bar}${hd('SERVICE PROJECT REPORT')}<h3>${esc(a.title)}</h3><p>${fd(a.date)}</p><table>${R('Beneficiaries served',a.ben||0)+R('Funds raised',php(a.raised))+R('Expenses',php(ex))+R('Members registered',(a.reg||[]).length)}</table><p style="white-space:pre-line">${esc(a.notes)}</p><div>${(a.photos||[]).map(i=>`<img src="/_blob/${esc(i)}" style="height:110px;margin:4px;border-radius:6px">`).join('')}</div><div class="sig"><div>Project chairperson</div><div>President</div></div></div>`}
const planDue=q=>{const t=new Date(),d=new Date(q.start+'T00:00');return Math.max(0,Math.min(q.n,(t.getFullYear()-d.getFullYear())*12+t.getMonth()-d.getMonth()+(t.getDate()>=d.getDate()?1:0)))};
function plansCard(){return`<div class="card"><h3>Payment plans</h3><div class="row"><label>Member<select id="qm">${opts()}</select></label><label>Installment (₱)<input id="qa" type="number" min="0"></label><label>No. of months<input id="qn" type="number" min="1"></label><label>First due<input id="qs" type="date" value="${today()}"></label><button class="b" onclick="addPlan()">Add plan</button></div><div class="tw"><table>${S.plans.map(q=>{const paid=S.payments.filter(x=>x.mid==q.mid&&!x.void&&x.date>=q.start).reduce((s,x)=>s+x.amt,0),beh=planDue(q)*q.amt-paid;return`<tr><td>${esc(mem(q.mid).name)}</td><td>${php(q.amt)} × ${q.n}</td><td>from ${fd(q.start)}</td><td class="n">${php(paid)} / ${php(q.amt*q.n)}</td><td>${beh>0?`<span class="tag bad">Behind ${php(beh)}</span>`:'<span class="tag ok">On track</span>'}</td><td><button class="b s x" onclick="del('plans','${q.id}')">✕</button></td></tr>`}).join('')}</table></div></div>`}
function addPlan(){const a=+v('qa'),n=+v('qn');if(!v('qm')||!(a>0)||!(n>0))return toast('Choose member, amount and months');S.plans.push({id:uid(),mid:v('qm'),amt:a,n,start:v('qs')||today()});save()}
V.exp=()=>{const col=S.payments.filter(p=>!p.void).reduce((s,p)=>s+p.amt,0),ex=S.exp.reduce((s,e)=>s+e.amt,0);
 return`<div class="grid"><div class="stat"><span>Collected</span><b class="ok">${php(col)}</b></div><div class="stat"><span>Expenses</span><b class="bad">${php(ex)}</b></div><div class="stat"><span>Funds on hand</span><b>${php(col-ex)}</b></div></div><div class="card"><h3>Record expense</h3><div class="row"><label>Date<input id="ed" type="date" value="${today()}"></label><label>Activity / project<select id="ea"><option value="">General</option>${S.activities.map(a=>`<option value="${a.id}">${esc(a.title)}</option>`).join('')}</select></label><label>Description<input id="et"></label><label>Amount (₱)<input id="eam" type="number" min="0"></label><button class="b" onclick="addExp()">Add</button></div></div><div class="card"><h3>Expenses</h3><div class="tw"><table><tr><th>Date</th><th>Activity</th><th>Description</th><th class="n">Amount</th><th></th></tr>${[...S.exp].sort((a,b)=>b.date.localeCompare(a.date)).map(e=>`<tr><td>${fd(e.date)}</td><td>${esc((S.activities.find(a=>a.id==e.act)||{}).title||'General')}</td><td>${esc(e.desc)}</td><td class="n">${php(e.amt)}</td><td><button class="b s x" onclick="del('exp','${e.id}')">✕</button></td></tr>`).join('')}</table></div></div>`};
function addExp(){const a=+v('eam'),t=v('et').trim();if(!(a>0)||!t)return toast('Enter description and amount');S.exp.push({id:uid(),date:v('ed')||today(),act:v('ea'),desc:t,amt:a});save()}
const regSt=(a,m)=>{const r=calc(m).rows.find(x=>x.desc===a.title+' contribution');return r?(r.bal<=0?'<span class="tag ok">Paid</span>':'<span class="tag bad">Unpaid</span>'):'<span class="tag">Not billed</span>'};
function regAct(id){const a=S.activities.find(x=>x.id==id),m=v('rg'+id);if(!m)return;a.reg=a.reg||[];if(!a.reg.includes(m))a.reg.push(m);save()}
function unreg(id,m){const a=S.activities.find(x=>x.id==id);a.reg=a.reg.filter(x=>x!==m);save()}
async function addPhoto(id,inp){const f=inp.files[0];if(!f)return;try{const A=await window.claude?.use('assets');if(!A)return toast('Photo upload not available');const r=await A.upload(f),a=S.activities.find(x=>x.id==id);(a.photos=a.photos||[]).push(r.id);save()}catch(e){toast('Upload failed')}}
function addAct(){const t=v('at').trim();if(!t)return toast('Enter a title');S.activities.push({id:uid(),title:t,date:v('ad')||today(),amt:+v('aa')||0,ben:+v('ab')||0,raised:+v('af')||0,notes:v('an'),reg:[],photos:[]});save()}
V.act=()=>`<div class="card edit"><h3>Add activity / service project</h3><div class="row"><label>Title<input id="at"></label><label>Date<input id="ad" type="date"></label><label>Contribution (₱)<input id="aa" type="number" min="0"></label><label>Beneficiaries<input id="ab" type="number" min="0"></label><label>Funds raised (₱)<input id="af" type="number" min="0"></label><label>Notes<input id="an"></label><button class="b" onclick="addAct()">Add</button></div></div>
<div class="card"><h3>Activities</h3>${[...S.activities].sort((a,b)=>b.date.localeCompare(a.date)).map(a=>`<div style="padding:10px 0;border-top:1px solid var(--bd)"><b>${esc(a.title)}</b> · ${fd(a.date)} · ${a.amt?php(a.amt):'Contribution TBA'}<div class="mu">${a.ben||0} beneficiaries · raised ${php(a.raised)} · ${esc(a.notes)}</div><div>Registered: ${(a.reg||[]).map(m=>`${esc(mem(m).name)} ${regSt(a,m)} <button class="b s x" onclick="unreg('${a.id}','${m}')">✕</button>`).join(' · ')||'—'}</div><div class="row edit" style="margin:6px 0"><label><select id="rg${a.id}"><option value="">Register member…</option>${opts()}</select></label><button class="b s" onclick="regAct('${a.id}')">Register</button></div><div>${(a.photos||[]).map(i=>`<img src="/_blob/${esc(i)}" style="height:60px;border-radius:6px;margin-right:4px">`).join('')}</div><label class="b s edit" style="display:inline-block;cursor:pointer;flex:none">📷 Add photo<input type="file" accept="image/*" hidden onchange="addPhoto('${a.id}',this)"></label> ${a.amt?`<button class="b s g" onclick="billAct('${a.id}')">Bill contribution</button> `:''}<button class="b s" onclick="doc={k:'svc',id:'${a.id}'};render()">Service report</button> <button class="b s x" onclick="del('activities','${a.id}')">Delete</button></div>`).join('')}</div>`;
init();
</script></body></html>
